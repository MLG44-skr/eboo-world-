<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" fill="none">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="40" markerHeight="40" refX="22" refY="12" orient="auto">
      <path d="M0,0 L28,12 L0,24 Z" fill="#0E0E0E"/>
    </marker>
  </defs>
  <rect width="1600" height="2560" fill="#FF6A1A"/>

  <text x="140" y="250" font-family="Instrument Sans, sans-serif" font-weight="600" font-size="54" letter-spacing="16" fill="#0E0E0E">MARCEL BARUT</text>

  <g font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="168" letter-spacing="-5" fill="#0E0E0E">
    <text x="134" y="560">Agenci AI</text>
    <text x="134" y="740">dla</text>
    <text x="134" y="920">początkujących</text>
  </g>
  <rect x="140" y="1000" width="340" height="28" rx="14" fill="#0E0E0E"/>

  <!-- motyw: przepływ zadanie -> narzędzie -> wynik + pętla agenta -->
  <g stroke="#0E0E0E" stroke-width="12" fill="none">
    <circle cx="300" cy="1700" r="130"/>
    <circle cx="800" cy="1700" r="130"/>
    <circle cx="1300" cy="1700" r="130"/>
    <line x1="440" y1="1700" x2="650" y2="1700" marker-end="url(#arrow)"/>
    <line x1="940" y1="1700" x2="1150" y2="1700" marker-end="url(#arrow)"/>
    <!-- pętla pod narzędziem -->
    <path d="M720 1810 a150 150 0 1 0 160 0" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Instrument Sans, sans-serif" font-weight="700" font-size="54" fill="#0E0E0E" text-anchor="middle">
    <text x="300" y="2000">zadanie</text>
    <text x="800" y="1715">narzędzie</text>
    <text x="1300" y="2000">wynik</text>
  </g>

  <text x="140" y="2470" font-family="Instrument Sans, sans-serif" font-weight="700" font-size="66" letter-spacing="20" fill="#0E0E0E">EBOOK</text>
</svg>
